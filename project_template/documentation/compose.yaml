services:
  strictdoc:
    image: ${STRICTDOC_IMAGE:-ghcr.io/molecularprogrammer/strictdoc:<tag>}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    ports:
      - "5111:5111"
    volumes:
      - ${DOCKER_MOUNT_PATH}:/workspace
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
