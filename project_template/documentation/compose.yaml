services:
  strictdoc:
    image: ${STRICTDOC_IMAGE:-ghcr.io/molecularprogrammer/strictdoc:<tag>}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${HOST_DOCKER_GID:-999}"
    ports:
      - "5111:5111"
    volumes:
      - ${HOST_PWD}/documentation:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - HOST_DOCKER_GID=${HOST_DOCKER_GID:-999}
      - HOST_PWD=${HOST_PWD}