version: '3'

tasks:

  _docker-run:
    internal: true
    dir: '{{.TASKFILE_DIR}}'
    vars:
      DOCKER_MOUNT_PATH: '{{.HOST_PWD}}/{{ trimPrefix "/workspace/" .TASKFILE_DIR }}'
    cmds:
    - DOCKER_MOUNT_PATH="{{.DOCKER_MOUNT_PATH}}" docker compose run --rm --service-ports strictdoc {{.CMD}}

  format:
    desc: "Rewrap .sdoc, .md, and .template files in /docs to 100 columns"
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 rewrap.py

  build:
    desc: "Validate the documentation and export the static website"
    deps:
      - :fetch
    cmds:
      - task: _docker-run
        vars:
          CMD: >
            strictdoc export .
            --config strictdoc_config.py
            --formats=html
            --generate-bundle-document

  serve:
    desc: "Run StrictDoc server"
    deps:
      - :fetch
    cmds:
      - task: _docker-run
        vars: { CMD: "strictdoc --debug server --host 0.0.0.0 --port 5111 --watch ."}

  bash:
    desc: "Enter the StrictDoc sibling container"
    cmds:
      - task: _docker-run
        vars: { CMD: "bash"}
