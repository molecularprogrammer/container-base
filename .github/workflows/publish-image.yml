name: Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: shared-proxy-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests in the published developer container
        env:
          CONTAINER_IMAGE: ghcr.io/molecularprogrammer/container-base:latest
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            --env HOST_DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)" \
            --env HOST_PWD="${GITHUB_WORKSPACE}" \
            --env SSH_AUTH_SOCK=/dev/null \
            "${CONTAINER_IMAGE}" task test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push developer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/molecularprogrammer/container-base:latest
            ghcr.io/molecularprogrammer/container-base:sha-${{ github.sha }}

      - name: Build and push proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          file: ./proxy/Dockerfile
          push: true
          tags: |
            ghcr.io/molecularprogrammer/ai-proxy:latest
            ghcr.io/molecularprogrammer/ai-proxy:sha-${{ github.sha }}

      - name: Build and push StrictDoc image
        uses: docker/build-push-action@v6
        with:
          context: ./strictdoc
          file: ./strictdoc/Dockerfile
          push: true
          tags: |
            ghcr.io/molecularprogrammer/strictdoc:latest
            ghcr.io/molecularprogrammer/strictdoc:sha-${{ github.sha }}
